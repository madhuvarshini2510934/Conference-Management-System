<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Papers</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">
        <h2>CMS</h2>

        <a href="author-dashboard.html">Dashboard</a>
        <a href="submit-paper.html">Submit Paper</a>
        <a href="my-papers.html">My Papers</a>
        <a href="#">Notifications</a>
        <a href="#">Profile</a>

        <button onclick="logout()">Logout</button>
    </div>

    <div class="main">

        <h1>My Papers</h1>
        <p>View all your submitted papers and their current status.</p>

        <div class="action-box">

<table class="paper-table" id="papersTable">

    <tr>
        <th>Paper ID</th>
        <th>Title</th>
        <th>Status</th>
        <th>Reviewer</th>
    </tr>

</table>

        </div>

    </div>

</div>

<script>

let authorName = localStorage.getItem("registeredName");

if (!authorName) {
    authorName = "Unknown Author";
}

fetch("http://localhost:8082/my-papers?authorName=" + encodeURIComponent(authorName))
    .then(response => response.text())
    .then(data => {

        let table = document.getElementById("papersTable");

        if (data.trim() === "") {
            return;
        }

        let papers = data.trim().split("\n");

        papers.forEach(function(paper) {

            let details = paper.split("|");

            let row = table.insertRow();

            row.insertCell(0).innerHTML = details[0];
            row.insertCell(1).innerHTML = details[1];
            row.insertCell(2).innerHTML =
                '<span class="status submitted">' + details[2] + '</span>';
            row.insertCell(3).innerHTML = details[3];

        });

    })
    .catch(error => {

        console.error(error);
        alert("Cannot connect to the Java server.");

    });

</script>

<script src="app.js"></script>

</body>
</html>
